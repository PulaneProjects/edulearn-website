version: 0.2

env:
  variables:
    BUILD_ENV: "production"
    APP_NAME: "edulearn-app"
    AWS_DEFAULT_REGION: "us-east-2"
    S3_BUCKET: "edulearn-bucket"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Starting build process..."

  pre_build:
    commands:
      - echo "Validating project files..."
      - ls -l
      - test -f index.html || (echo "index.html not found!" && exit 1)

  build:
    commands:
      - echo "No build step required for static HTML site"

  post_build:
    commands:
      - echo "Uploading files to S3..."
      - aws s3 sync . s3://$S3_BUCKET --delete
      - echo "Deployment to S3 completed successfully."

artifacts:
  files:
    - '**/*'
  discard-paths: no
``
