<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduLearn Platform</title>
 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: #f5f6fa;
            color: #2c3e50;
        }
 
        header {
            background: linear-gradient(90deg, #2c3e50, #3498db);
            color: white;
            padding: 20px;
            text-align: center;
        }
 
        nav {
            background: #34495e;
            padding: 10px;
            text-align: center;
        }
 
        nav button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            background: #1abc9c;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
 
        nav button:hover {
            background: #16a085;
        }
 
        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
 
        .card {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }
 
        input {
            width: 90%;
            padding: 10px;
            margin: 5px 0;
        }
 
        button.action {
            background: #3498db;
            margin-top: 10px;
        }
 
        button.delete {
            background: #e74c3c;
        }
 
        footer {
            text-align: center;
            padding: 15px;
            background: #2c3e50;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
 
<body>
 
<header>
    <h1>EduLearn Platform</h1>
    <p>Manage your courses easily</p>
</header>
 
<nav>
    <button onclick="loadCourses()">View Courses</button>
    <button onclick="showAddForm()">Add Course</button>
</nav>
 
<div class="container" id="content">
    <h2>Welcome to EduLearn</h2>
    <p>Select an option above to begin.</p>
</div>
 
<footer>
    <p>EduLearn © 2026 | Cloud-based Learning Platform</p>
</footer>
 
<script>
 
// Replace with your API Gateway Invoke URL
const API_URL = "https://<api-id>.execute-api.us-east-2.amazonaws.com/prod/api/courses";
 
// Load Courses
function loadCourses() {
    fetch(API_URL)
        .then(res => res.json())
        .then(data => {
            let html = "<h2>Available Courses</h2>";
 
            if (data.length === 0) {
                html += "<p>No courses available.</p>";
            }
 
            data.forEach(course => {
                html += `
                    <div class="card">
                        <h3>${course.title}</h3>
                        <p>${course.description}</p>
                        <button class="delete" onclick="deleteCourse('${course.id}')">
                            Delete
                        </button>
                    </div>
                `;
            });
 
            document.getElementById("content").innerHTML = html;
        })
        .catch(() => {
            document.getElementById("content").innerHTML =
                "<p>Error loading courses.</p>";
        });
}
 
//  Show Add Form
function showAddForm() {
    document.getElementById("content").innerHTML = `
        <h2>Add New Course</h2>
        <input id="title" placeholder="Course Title">
        <input id="desc" placeholder="Course Description">
        <br>
        <button class="action" onclick="addCourse()">Add Course</button>
    `;
}
 
// Add Course
function addCourse() {
    const title = document.getElementById("title").value;
    const desc = document.getElementById("desc").value;
 
    fetch(API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: title,
            description: desc
        })
    })
    .then(() => {
        loadCourses();
    });
}
 
// Delete Course
function deleteCourse(id) {
    fetch(API_URL + "/" + id, {
        method: "DELETE"
    })
    .then(() => {
        loadCourses();
    });
}
 
</script>
 
</body>
</html>
