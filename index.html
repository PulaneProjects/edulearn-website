<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>EduLearn Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        header {
            background: linear-gradient(135deg, #1f3b73, #3498db);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
            letter-spacing: 0.5px;
        }

        header p {
            margin-top: 10px;
            font-size: 1rem;
            opacity: 0.95;
        }

        .top-banner {
            background: #eaf4ff;
            color: #1f3b73;
            padding: 14px 20px;
            text-align: center;
            font-size: 0.95rem;
            border-bottom: 1px solid #d6e6f7;
        }

        nav {
            background: #243447;
            padding: 14px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        nav button {
            margin: 6px;
            padding: 11px 20px;
            border: none;
            background: #1abc9c;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        nav button:hover {
            background: #16a085;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 40px;
        }

        .hero-box,
        .content-card,
        .loading-card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .hero-box h2,
        .content-card h2,
        .loading-card h2 {
            margin-top: 0;
            color: #1f3b73;
        }

        .hero-box p,
        .content-card p,
        .loading-card p {
            line-height: 1.7;
            color: #4b5b6b;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 25px;
        }

        .stat-card {
            background: #f8fbff;
            border-left: 5px solid #3498db;
            padding: 18px;
            border-radius: 10px;
        }

        .stat-card h3 {
            margin: 0;
            color: #1f3b73;
            font-size: 1.5rem;
        }

        .stat-card p {
            margin: 8px 0 0;
            font-size: 0.95rem;
            color: #555;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-top: 30px;
        }

        .feature-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            border-top: 4px solid #1abc9c;
        }

        .feature-card h3 {
            margin-top: 0;
            color: #1f3b73;
            font-size: 1.1rem;
        }

        .feature-card p {
            margin-bottom: 0;
            color: #5d6c7a;
            line-height: 1.6;
        }

        .loading-card {
            text-align: center;
            padding: 60px 25px;
        }

        .loading-badge {
            display: inline-block;
            background: #eef6ff;
            color: #1f3b73;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 18px;
            border: 1px solid #cfe2ff;
        }

        .loading-message {
            font-size: 1.15rem;
            font-weight: 600;
            color: #2c3e50;
            margin-top: 12px;
        }

        .page-label {
            font-size: 0.95rem;
            color: #7a8a99;
            margin-top: 8px;
        }

        footer {
            text-align: center;
            padding: 18px;
            background: #243447;
            color: white;
            margin-top: auto;
            font-size: 0.95rem;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            nav button {
                width: 100%;
                max-width: 280px;
            }

            .hero-box,
            .content-card,
            .loading-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header>
            <h1>EduLearn Platform</h1>
            <p>Scalable cloud-based learning platform for students and instructors</p>
        </header>

        <div class="top-banner">
            AWS Deployment: Static frontend on <strong>S3</strong> | Backend APIs via 
            <strong>API Gateway + Fargate</strong> | Course data in <strong>RDS</strong>
        </div>

        <nav>
            <button onclick="showHome()">Home</button>
            <button onclick="showLoadingPage('View Courses')">View Courses</button>
            <button onclick="showLoadingPage('Add Course')">Add Course</button>
            <button onclick="showLoadingPage('Learning Progress')">Learning Progress</button>
        </nav>

        <main>
            <div class="container" id="page-content">
                <!-- Home content loads here -->
            </div>
        </main>

        <footer>
            <p>&copy; 2026 AWS TEAM1 ALL RIGHTS RESERVED</p>
        </footer>
    </div>

    <script>
        function showHome() {
            document.getElementById("page-content").innerHTML = `
                <div class="hero-box">
                    <h2>Welcome to EduLearn</h2>
                    <p>
                        EduLearn is a modern online learning platform designed to help students enroll in courses,
                        access learning content, monitor progress, and interact with instructors through a scalable,
                        secure, and cloud-based AWS architecture.
                    </p>

                    <div class="stats">
                        <div class="stat-card">
                            <h3>24/7</h3>
                            <p>Cloud availability for learners</p>
                        </div>
                        <div class="stat-card">
                            <h3>AWS</h3>
                            <p>Hosted on reliable cloud infrastructure</p>
                        </div>
                        <div class="stat-card">
                            <h3>Secure</h3>
                            <p>Built with scalable and secure deployment practices</p>
                        </div>
                        <div class="stat-card">
                            <h3>Flexible</h3>
                            <p>Designed for students and instructors</p>
                        </div>
                    </div>
                </div>

                <div class="feature-grid">
                    <div class="feature-card">
                        <h3>Course Access</h3>
                        <p>Students can browse courses, enroll, and access learning materials anytime.</p>
                    </div>
                    <div class="feature-card">
                        <h3>Progress Tracking</h3>
                        <p>Monitor educational progress and support structured learning outcomes.</p>
                    </div>
                    <div class="feature-card">
                        <h3>Scalable Architecture</h3>
                        <p>Powered by AWS services to support performance, growth, and reliability.</p>
                    </div>
                    <div class="feature-card">
                        <h3>Cloud-Native Deployment</h3>
                        <p>Static frontend hosting, API management, and backend services built for the cloud.</p>
                    </div>
                </div>
            `;
        }

        function showLoadingPage(pageName) {
            document.getElementById("page-content").innerHTML = `
                <div class="loading-card">
                    <div class="loading-badge">${pageName}</div>
                    <h2>Page Under Preparation</h2>
                    <p class="loading-message">WEBSITE LOADING , COME BACK LATER FOR THE GREAT STUFF:):)</p>
                    <p class="page-label">This section is currently being prepared and will be available soon.</p>
                </div>
            `;
        }

        // Load Home page by default
        showHome();
    </script>
</body>
</html>
